<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>이종빈 · 백엔드 개발자 포트폴리오</title>
    <meta
      name="description"
      content="식품영양학과에서 Spring Boot 서버까지. 세 번의 팀 프로젝트에서 게시판·관리자, 전통시장 매칭, 캠핑장·날씨 도메인을 맡은 신입 백엔드 개발자 이종빈입니다."
    />
    <meta name="author" content="이종빈" />

    <!--
      배포 후 할 일 — 아래 og:url 과 og:image 를 실제 절대 주소로 바꾸세요.
        예) https://jongbeen97.github.io  /  https://jongbeen97.github.io/og.png
      카카오톡·링크드인·슬랙 같은 크롤러는 상대 경로를 제대로 못 읽는 경우가 있어
      링크 미리보기를 확실히 띄우려면 절대 주소여야 합니다.
      이미지는 public/og.png (1200x630) 이며 tools/make-og.ps1 로 다시 만들 수 있습니다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="이종빈 · 백엔드 개발자 포트폴리오" />
    <meta
      property="og:description"
      content="비전공에서 출발해 Spring Boot 서버 앞에 앉기까지. 세 번의 팀 프로젝트를 검증 가능한 코드로 보여드립니다."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="이종빈 포트폴리오" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="이종빈 · 백엔드 개발자 포트폴리오" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="이종빈 · 백엔드 개발자 포트폴리오" />
    <meta
      name="twitter:description"
      content="비전공에서 출발해 Spring Boot 서버 앞에 앉기까지. 세 번의 팀 프로젝트를 검증 가능한 코드로 보여드립니다."
    />
    <meta name="twitter:image" content="/og.png" />

    <meta name="theme-color" content="#08121C" />

    <style>
      html { background: #f5f7f8; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
