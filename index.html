    <meta

      content="식품영양학과에서 Spring Boot 서버까지. 세 번의 팀 프로젝트에서 서버와 화면을 함께 맡고, LLM·RAG 연동과 클라우드 배포까지 다뤄본 신입 풀스택 개발자 이종빈입니다."

    <!--
      ┌─ Vercel 첫 배포 후 딱 한 번 할 일 ────────────────────────────────┐
      │ 아래 og:url 과 og:image 의 값을 발급받은 실제 주소로 바꾸세요.     │
      │   og:url   → https://<프로젝트명>.vercel.app                      │
      │   og:image → https://<프로젝트명>.vercel.app/og.png               │
      │                                                                   │
      │ 다른 경로는 전부 상대 경로라 손댈 필요가 없지만, 이 두 줄만은      │
      │ 절대 주소여야 합니다. 카카오톡·링크드인·슬랙 크롤러는 페이지를     │
      │ 서버에서 긁어가기 때문에 상대 경로를 해석하지 못해, 지금 상태로는  │
      │ 링크 미리보기가 빈 카드로 뜹니다.                                 │
      │                                                                   │
      │ 주소를 바꾼 뒤 카카오톡 미리보기는 캐시가 남아 있을 수 있습니다.   │
      │ https://developers.kakao.com/tool/clear/og 에서 초기화하세요.      │
      │                                                                   │
      │ 이미지 원본: public/og.png (1200x630)                             │
      │ 다시 만들기: powershell tools/make-og.ps1 public/og.png            │
      │              문구는 tools/og-text.json 에서 수정                   │
      └───────────────────────────────────────────────────────────────────┘
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="이종빈 · 풀스택 개발자 포트폴리오" />
    <meta
      property="og:description"
      content="비전공에서 출발해 서버 · 화면 · AI 연동 · 배포까지. 세 번의 팀 프로젝트를 검증 가능한 코드로 보여드립니다."
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="이종빈 포트폴리오" />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="이종빈 · 풀스택 개발자 포트폴리오" />

    <meta name="twitter:card" content="summary_large_image" />
